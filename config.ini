;; ~/.config/polybar/config.ini
;; Polybar 3.7+ (for the tray module). Check with: polybar --version
;;
;; Colors come from pywal through xrdb, so a theme change only needs a
;; polybar restart (~/.config/wal/reload.sh does this).
;; The launch script sets MONITOR, POLYBAR_MODULES_RIGHT, POLYBAR_HWMON,
;; POLYBAR_BATTERY, POLYBAR_ADAPTER and POLYBAR_BACKLIGHT from what it finds
;; on the machine.

;; ---------------------------------------------------------------- colors
[colors]
background     = ${xrdb:background:#1d2021}
foreground     = ${xrdb:foreground:#ebdbb2}
background-alt = ${xrdb:color0:#282828}
primary        = ${xrdb:color4:#83a598}
secondary      = ${xrdb:color2:#b8bb26}
warn           = ${xrdb:color3:#fabd2f}
alert          = ${xrdb:color1:#fb4934}
disabled       = ${xrdb:color8:#665c54}

;; ------------------------------------------------------------------- bar
[bar/main]
monitor          = ${env:MONITOR:}
monitor-strict   = false
width            = 100%
height           = 26pt
fixed-center     = true

background       = ${colors.background}
foreground       = ${colors.foreground}

line-size        = 2pt
border-size      = 0
padding-left     = 0
padding-right    = 1
module-margin    = 1

separator            = |
separator-foreground = ${colors.disabled}

; Needs a Nerd Font for the icons (e.g. ttf-jetbrains-mono-nerd)
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=13;3"
font-2 = "Noto Sans CJK JP:size=10;2"

modules-left   = launcher i3 xwindow
modules-center = date
modules-right  = ${env:POLYBAR_MODULES_RIGHT:filesystem pulseaudio memory cpu powermenu}

cursor-click  = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3

;; --------------------------------------------------------------- modules
[module/launcher]
type = custom/text
format = 󰣇
format-font = 2
format-foreground = ${colors.primary}
format-padding = 1
click-left  = rofi -show drun &
click-right = ~/.config/rofi/wallpaper.sh &

[module/powermenu]
type = custom/text
format = ⏻
format-foreground = ${colors.alert}
format-padding = 1
click-left = ~/.config/rofi/powermenu.sh &

[module/i3]
type = internal/i3
pin-workspaces   = true
show-urgent      = true
strip-wsnumbers  = true
index-sort       = true
enable-click     = true
enable-scroll    = true
wrapping-scroll  = false
reverse-scroll   = false

format = <label-state> <label-mode>

label-mode            = %mode%
label-mode-padding    = 1
label-mode-background = ${colors.warn}
label-mode-foreground = ${colors.background}

label-focused            = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline  = ${colors.primary}
label-focused-padding    = 1

label-unfocused         = %name%
label-unfocused-padding = 1

label-visible           = %name%
label-visible-underline = ${colors.disabled}
label-visible-padding   = 1

label-urgent            = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding    = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:…%
label-empty = Desktop
label-empty-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1
; click to toggle the long format
date     = %a %b %d
time     = %H:%M
date-alt = %A, %B %d %Y
time-alt = %H:%M:%S
format-prefix = "󰃭 "
format-prefix-foreground = ${colors.primary}
label = %date%  %time%

[module/filesystem]
type = internal/fs
mount-0 = /
; add more mounts here, e.g. mount-1 = /home
interval = 30
fixed-values = true
warn-percentage = 90

format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %percentage_used%%

format-warn = <label-warn>
label-warn = 󰋊 %mountpoint% %percentage_used%%
label-warn-foreground = ${colors.alert}

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
; Works with PipeWire through pipewire-pulse too
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}
label-volume = %percentage%%

label-muted = 󰝟 muted
label-muted-foreground = ${colors.disabled}

; left click mutes, scroll changes volume (built in)
click-right = pavucontrol &

[module/memory]
type = internal/memory
interval = 2
warn-percentage = 90

format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%% %gb_used%

format-warn = <label-warn>
label-warn = 󰍛 %percentage_used:2%% %gb_used%
label-warn-foreground = ${colors.alert}

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 90

; per-core load bars; drop <ramp-coreload> if you have a lot of cores
format = <label> <ramp-coreload>
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

format-warn = <label-warn> <ramp-coreload>
format-warn-prefix = "󰻠 "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %percentage:2%%
label-warn-foreground = ${colors.alert}

ramp-coreload-spacing = 0
ramp-coreload-0 = ▁
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █
ramp-coreload-0-foreground = ${colors.disabled}
ramp-coreload-1-foreground = ${colors.disabled}
ramp-coreload-2-foreground = ${colors.secondary}
ramp-coreload-3-foreground = ${colors.secondary}
ramp-coreload-4-foreground = ${colors.warn}
ramp-coreload-5-foreground = ${colors.warn}
ramp-coreload-6-foreground = ${colors.alert}
ramp-coreload-7-foreground = ${colors.alert}

[module/temperature]
type = internal/temperature
interval = 3
; The launch script finds the CPU sensor (coretemp / k10temp / zenpower),
; because hwmon numbering can change between boots.
; Empty falls back to thermal-zone.
hwmon-path = ${env:POLYBAR_HWMON:}
thermal-zone = 0
base-temperature = 30
warn-temperature = 80

format = <ramp> <label>
format-warn = <ramp> <label-warn>
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

ramp-0 =
ramp-1 =
ramp-2 =
ramp-3 =
ramp-4 =
ramp-foreground = ${colors.primary}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
accumulate-stats = true
unknown-as-up = true

format-connected = <ramp-signal> <label-connected>
; click the SSID to open networkmanager_dmenu (remove the %{A} tags if you don't use it)
label-connected = %{A1:networkmanager_dmenu &:}%essid%%{A}  %downspeed:8%  %upspeed:8%
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = ${colors.primary}

format-disconnected = <label-disconnected>
label-disconnected = 󰤮 offline
label-disconnected-foreground = ${colors.disabled}

[module/eth]
type = internal/network
interface-type = wired
interval = 3
accumulate-stats = true

format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %local_ip%  %downspeed:8%  %upspeed:8%

format-disconnected =

[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BATTERY:BAT0}
adapter = ${env:POLYBAR_ADAPTER:AC}
full-at = 98
low-at = 15
poll-interval = 5
time-format = %H:%M

format-charging = <animation-charging> <label-charging>
label-charging = %percentage%% %time%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%% %time%

format-full = <ramp-capacity> <label-full>
label-full = full

format-low = <animation-low> <label-low>
label-low = %percentage%% %time%
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁽
ramp-capacity-3 = 󰁿
ramp-capacity-4 = 󰂁
ramp-capacity-5 = 󰁹
ramp-capacity-foreground = ${colors.primary}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂇
animation-charging-2 = 󰢝
animation-charging-3 = 󰂉
animation-charging-4 = 󰂅
animation-charging-foreground = ${colors.secondary}
animation-charging-framerate = 750

animation-low-0 = 󰂃
animation-low-1 = " "
animation-low-foreground = ${colors.alert}
animation-low-framerate = 500

[module/backlight]
type = internal/backlight
card = ${env:POLYBAR_BACKLIGHT:intel_backlight}
use-actual-brightness = true
; scrolling needs write access to /sys/class/backlight/*/brightness
; (add yourself to the 'video' group + a udev rule, or use brightnessctl)
enable-scroll = true

format = <ramp> <label>
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
ramp-foreground = ${colors.primary}

[module/tray]
type = internal/tray
tray-spacing = 6pt
tray-size = 66%

;; -------------------------------------------------------------- settings
[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
