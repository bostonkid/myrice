# ember — ranger (loaded on top of ranger's defaults)
set colorscheme ember
set viewmode miller
set column_ratios 1,3,4
set draw_borders both
set dirname_in_tabs true
set unicode_ellipsis true
set tilde_in_titlebar true
set scroll_offset 6
set wrap_scroll true
set mouse_enabled true
set update_title true
set vcs_aware false
set confirm_on_delete multiple
set save_console_history false

set show_hidden false
set hidden_filter ^\.|\.(?:pyc|pyo|bak|swp)$|^lost\+found$|^__(py)?cache__$
set sort natural
set sort_directories_first true
set automatically_count_files true

# previews (run `ranger --copy-config=scope` once to get scope.sh)
set preview_files true
set preview_directories true
set use_preview_script true
set collapse_preview true
set preview_images true
set preview_images_method w3m

# ── jumps ───────────────────────────────────────────
map gC cd ~/.config
map gD cd ~/Downloads
map gP cd ~/Pictures
map gV cd ~/Videos
map gW cd ~/Wallpapers

# ── actions ─────────────────────────────────────────
map X shell -f urxvt -cd %d
map W shell -f feh --bg-fill %f
map <C-p> shell -f mpv --force-window=yes %s
